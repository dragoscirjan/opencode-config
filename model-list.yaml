# OpenCode Model Tiering Configuration
# Combinations are structured by Provider: Local, Copilot, OpenRouter.
# Ordered from Cheapest (or lowest hardware requirement) to Most Expensive.
# Each combination defines a 'normal' agent (A-Tier/Fast) and a 'big_brother' agent (S-Tier/Heavy).

# =========================================================================
# 💻 PROVIDER: LOCAL (Ollama / LM Studio)
# Ranked by VRAM requirements. Free to run.
# =========================================================================

local-8gb:
  description: "Runs on basic laptops. Qwen 7B for daily coding, DeepSeek R1 8B for reasoning."
  normal: "ollama/qwen2.5-coder:7b"
  big_brother: "ollama/deepseek-r1:8b"

local-16gb:
  description: "Standard developer machine. Qwen 32B provides massive quality bumps over 7B."
  normal: "ollama/qwen2.5-coder:32b"
  big_brother: "ollama/deepseek-r1:14b"

local-32gb:
  description: "High-end machine. Full 32B reasoning model for Big Brother tasks."
  normal: "ollama/qwen2.5-coder:32b"
  big_brother: "ollama/deepseek-r1:32b"

local-64gb:
  description: "Mac Studio / Workstation tier. Rivals proprietary models."
  normal: "ollama/qwen2.5-coder:72b"
  big_brother: "ollama/deepseek-r1:70b"

# =========================================================================
# 🌐 PROVIDER: OPENROUTER
# Ranked by Cost-to-Performance using live 2026 data.
# =========================================================================

openrouter-ultra-budget:
  description: "Pennies per day. Qwen 9B ($0.04/M) with DeepSeek V3.2 ($0.23/M) as backup."
  normal: "qwen/qwen3.5-9b"
  big_brother: "deepseek/deepseek-v3.2"

openrouter-value:
  description: "The sweet spot. Step 3.5 Flash ($0.09/M) and MiniMax M2.5 ($0.15/M)."
  normal: "stepfun/step-3.5-flash"
  big_brother: "minimax/minimax-m2.5"

openrouter-standard:
  description: "High capability, reasonable price. Gemini 3.1 Pro ($2/M) + GPT-5.4 ($2.50/M)."
  normal: "google/gemini-3.1-pro-preview"
  big_brother: "openai/gpt-5.4"

openrouter-premium:
  description: "The Gold Standard. Claude Sonnet 4.6 ($3/M) + Claude Opus 4.6 ($5/M)."
  normal: "anthropic/claude-sonnet-4.6"
  big_brother: "anthropic/claude-opus-4.6"

# =========================================================================
# 🏢 PROVIDER: GITHUB COPILOT
# Flat subscription, restricted to major US providers.
# =========================================================================

copilot-budget:
  description: "Fastest autocomplete class models. Zero rate-limit worries."
  normal: "github-copilot/gpt-4o-mini"
  big_brother: "github-copilot/o3-mini"

copilot-standard:
  description: "Excellent daily driving with Gemini context, Sonnet for heavy lifting."
  normal: "github-copilot/gemini-3.1-pro-preview"
  big_brother: "github-copilot/claude-sonnet-4.6"

copilot-premium:
  description: "The best of Anthropic available on Copilot."
  normal: "github-copilot/claude-sonnet-4.6"
  big_brother: "github-copilot/claude-opus-4.6"

copilot-architect:
  description: "Maximum intelligence. GPT-5.4 logic with o1 deep reasoning."
  normal: "github-copilot/gpt-5.4"
  big_brother: "github-copilot/o1"
